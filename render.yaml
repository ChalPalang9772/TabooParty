services:
  # --- BACKEND SERVICE ---
  - type: web
    name: tabooparty-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  # --- FRONTEND SERVICE ---
  - type: web
    name: tabooparty-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: tabooparty-backend
          property: host
